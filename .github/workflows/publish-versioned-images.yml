name: Publish versioned containers
'on':
  push:
    tags:
    - v*
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: versioned-containers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - env:
        TAG: ${{ github.ref_name }}
      run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
  publish:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - image: typesense-dashboard
          dockerfile: Dockerfile.production
          context: .
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      distribute: true
      runner: 'default=ubuntu-24.04

        linux/arm64=ubuntu-24.04-arm

        '
      context: ${{ matrix.context }}
      file: ${{ matrix.dockerfile }}
      platforms: linux/amd64,linux/arm64
      setup-qemu: false
      artifact-name: image-${{ matrix.image }}
      job-name-prefix: ${{ matrix.image }}
      meta-images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      meta-tags: 'type=semver,pattern={{version}}

        type=sha,prefix=sha-,format=long

        '
      meta-labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      set-meta-labels: true
      sbom: true
      cache: true
      cache-scope: versioned-${{ matrix.image }}
      cache-mode: max
    secrets:
      registry-auths: "- registry: ghcr.io\n  username: ${{ github.actor }}\n  password: ${{ secrets.GITHUB_TOKEN }}\n"
