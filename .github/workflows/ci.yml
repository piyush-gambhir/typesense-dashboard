name: CI

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    strategy:
      matrix:
        node: [24.22.1, 26.12.1]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run typecheck:compat
      - run: pnpm run test
      - run: pnpm run build
